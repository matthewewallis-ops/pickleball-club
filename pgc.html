
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pickleball Club | Official Rankings</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #172b4d;
}

header {
    background: #002b5c;
    color: white;
}

.top-header {
    max-width: 1250px;
    margin: auto;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #00a8ff;
}

nav {
    background: #001f42;
    padding: 18px 8%;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border-bottom: 3px solid #0075d5;
}

.hero {
    background: linear-gradient(115deg, #003c80, #001b3b);
    color: white;
    padding: 75px 8%;
}

.hero-label {
    color: #73c8ff;
    font-size: 13px;
    letter-spacing: 2px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(38px, 6vw, 60px);
    margin-top: 15px;
    letter-spacing: -1px;
}

.container {
    max-width: 1250px;
    margin: 50px auto;
    padding: 0 25px;
    min-height: 400px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
    flex-wrap: wrap;
}

.section-header h2 {
    font-size: 30px;
    color: #002b5c;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    font-family: inherit;
}

.primary {
    background: #0071ce;
    color: white;
}

.secondary {
    background: #e5edf5;
    color: #002b5c;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

.hidden {
    display: none !important;
}

/* RANKINGS */

.table-wrapper {
    background: white;
    border: 1px solid #e1e5eb;
    border-radius: 5px;
    overflow-x: auto;
    box-shadow: 0 5px 25px rgba(0,0,0,0.04);
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
}

thead {
    background: #eef2f7;
}

th {
    text-align: left;
    padding: 20px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #53677f;
}

td {
    padding: 25px 20px;
    border-bottom: 1px solid #e8edf2;
    font-size: 15px;
}

tbody tr:hover {
    background: #f4f9ff;
}

.rank {
    font-size: 27px;
    font-weight: 800;
    color: #002b5c;
}

.player {
    font-size: 17px;
    font-weight: bold;
    color: #003b7a;
}

.points {
    font-size: 18px;
    font-weight: bold;
}

.player-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    background: #e2ebf5;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #003b7a;
    font-weight: bold;
    font-size: 13px;
}

/* ADMIN */

.admin-panel {
    background: white;
    padding: 25px;
    border: 1px solid #dce1e8;
    margin-bottom: 25px;
    border-radius: 5px;
}

.admin-panel h3 {
    margin-bottom: 20px;
    color: #002b5c;
}

.auth-fields {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 12px;
    border: 1px solid #cbd5df;
    border-radius: 4px;
    font: inherit;
}

.edit-row {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) repeat(3, minmax(80px, 130px));
    gap: 15px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid #e8edf2;
}

.edit-row input {
    width: 100%;
}

.edit-row label {
    display: block;
    font-size: 12px;
    color: #64788c;
    margin-bottom: 6px;
}

.editor-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.status {
    margin-top: 20px;
    font-size: 14px;
    color: #53677f;
}

footer {
    background: #001f42;
    color: white;
    text-align: center;
    padding: 50px 20px;
    margin-top: 100px;
}

footer h3 {
    font-size: 24px;
}

footer p {
    margin-top: 12px;
    color: #9cb0c7;
    font-size: 13px;
}

@media(max-width:700px) {
    .edit-row {
        grid-template-columns: repeat(3, 1fr);
    }

    .edit-row strong {
        grid-column: 1/-1;
    }

    .top-header {
        padding: 20px;
    }

    .logo {
        font-size: 20px;
    }

    .hero {
        padding: 60px 20px;
    }

    .container {
        margin-top: 30px;
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="top-header">
        <div class="logo">
            PICKLEBALL<span>CLUB</span>
        </div>
        <div>2026 SEASON</div>
    </div>
</header>

<nav>Rankings</nav>

<section class="hero">
    <div class="hero-label">2026 SEASON</div>
    <h1>Official Rankings</h1>
</section>

<main class="container">

    <div class="section-header">
        <h2>Club Rankings</h2>

        <div class="actions">
            <button class="secondary" id="adminButton">
                Admin Login
            </button>

            <button class="primary hidden" id="editButton">
                Edit Rankings
            </button>

            <button class="secondary hidden" id="logoutButton">
                Log Out
            </button>
        </div>
    </div>

    <!-- LOGIN PANEL -->

    <div id="authPanel" class="admin-panel hidden">
        <h3>Administrator Login</h3>

        <form id="loginForm" class="auth-fields">
            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="username"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button class="primary" type="submit" id="loginButton">
                Log In
            </button>
        </form>
    </div>

    <!-- ADMIN EDITOR -->

    <div id="editor" class="admin-panel hidden">
        <h3>Edit Player Rankings</h3>

        <div id="editRows"></div>

        <div class="editor-actions">
            <button class="primary" id="saveButton">
                Save Changes
            </button>

            <button class="secondary" id="cancelButton">
                Cancel
            </button>
        </div>
    </div>

    <!-- RANKINGS TABLE -->

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Points</th>
                    <th>Wins</th>
                    <th>Losses</th>
                    <th>Win %</th>
                </tr>
            </thead>

            <tbody id="rankingsBody"></tbody>
        </table>
    </div>

    <p id="status" class="status" role="status"></p>

</main>

<footer>
    <h3>Pickleball Club</h3>
    <p>Official Rankings — 2026 Season</p>
    <p>© 2026 Pickleball Club</p>
</footer>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* SUPABASE CONNECTION */

const SUPABASE_URL =
    "https://iwqidqqwrojottqamyte.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_V0a0vy7jv8j1XXWryFjdlA_9Uw73d7g";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let isAdmin = false;
let players = [];

/* STATUS MESSAGE */

function status(message) {
    $("status").textContent = message;
}

/* DISPLAY RANKINGS */

function renderRankings() {

    const sorted = [...players].sort(
        (a, b) => b.points - a.points || a.id - b.id
    );

    const tbody = $("rankingsBody");
    tbody.innerHTML = "";

    sorted.forEach((p, index) => {

        const total = p.wins + p.losses;

        const percentage = total
            ? ((p.wins / total) * 100).toFixed(1)
            : "0.0";

        const initials = p.name
            .split(" ")
            .map(word => word[0])
            .join("");

        const tr = document.createElement("tr");

        const rank = tr.insertCell();
        rank.className = "rank";
        rank.textContent = index + 1;

        const playerCell = tr.insertCell();

        const info = document.createElement("div");
        info.className = "player-info";

        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.textContent = initials;

        const name = document.createElement("span");
        name.className = "player";
        name.textContent = p.name;

        info.append(avatar, name);
        playerCell.append(info);

        const pointsCell = tr.insertCell();
        pointsCell.className = "points";
        pointsCell.textContent = p.points.toLocaleString();

        tr.insertCell().textContent = p.wins;
        tr.insertCell().textContent = p.losses;
        tr.insertCell().textContent = percentage + "%";

        tbody.appendChild(tr);
    });
}

/* LOAD RANKINGS FROM SUPABASE */

async function loadRankings() {

    const { data, error } = await supabase
        .from("players")
        .select("id,name,points,wins,losses");

    if (error) {
        status("Could not load rankings: " + error.message);
        return;
    }

    players = data || [];

    renderRankings();

    status("Rankings updated.");
}

/* CHECK ADMIN PERMISSIONS */

async function checkAdmin() {

    const { data: { user }, error: authError } =
        await supabase.auth.getUser();

    isAdmin = false;

    if (!authError && user) {

        const { data, error } = await supabase
            .from("club_admins")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

        isAdmin = !error && !!data;
    }

    $("adminButton").classList.toggle(
        "hidden", isAdmin
    );

    $("editButton").classList.toggle(
        "hidden", !isAdmin
    );

    $("logoutButton").classList.toggle(
        "hidden", !isAdmin
    );

    if (!isAdmin) {
        $("editor").classList.add("hidden");
    }

    return isAdmin;
}

/* ADMIN LOGIN */

$("adminButton").onclick = () => {
    $("authPanel").classList.toggle("hidden");
};

$("loginForm").onsubmit = async event => {

    event.preventDefault();

    const email = $("email").value.trim();
    const password = $("password").value;

    const button = $("loginButton");
    button.disabled = true;

    status("Signing in...");

    const { error } = await supabase.auth
        .signInWithPassword({
            email,
            password
        });

    button.disabled = false;

    if (error) {
        status("Login failed: " + error.message);
        return;
    }

    const authorized = await checkAdmin();

    $("password").value = "";
    $("authPanel").classList.add("hidden");

    status(
        authorized
            ? "Administrator logged in successfully."
            : "This account is not authorized to edit rankings."
    );
};

/* LOGOUT */

$("logoutButton").onclick = async () => {

    const { error } = await supabase.auth.signOut();

    if (error) {
        status("Logout failed: " + error.message);
        return;
    }

    await checkAdmin();

    status("Logged out successfully.");
};

/* OPEN RANKINGS EDITOR */

$("editButton").onclick = () => {

    if (!isAdmin) return;

    const container = $("editRows");

    container.innerHTML = "";

    const sorted = [...players].sort(
        (a, b) => b.points - a.points || a.id - b.id
    );

    sorted.forEach(player => {

        const row = document.createElement("div");

        row.className = "edit-row";
        row.dataset.id = player.id;

        const name = document.createElement("strong");
        name.textContent = player.name;

        row.appendChild(name);

        ["points", "wins", "losses"].forEach(field => {

            const wrapper = document.createElement("div");

            const label = document.createElement("label");

            label.textContent =
                field.charAt(0).toUpperCase() +
                field.slice(1);

            const input = document.createElement("input");

            input.type = "number";
            input.min = "0";
            input.step = "1";
            input.value = player[field];
            input.dataset.field = field;

            label.appendChild(input);
            wrapper.appendChild(label);

            row.appendChild(wrapper);
        });

        container.appendChild(row);
    });

    $("editor").classList.remove("hidden");
};

/* CANCEL EDITING */

$("cancelButton").onclick = () => {
    $("editor").classList.add("hidden");
};

/* SAVE RANKINGS */

$("saveButton").onclick = async () => {

    if (!isAdmin) {
        status("Administrator access required.");
        return;
    }

    const updates = [];

    for (const row of document.querySelectorAll(".edit-row")) {

        const updated = {
            id: Number(row.dataset.id)
        };

        for (const input of row.querySelectorAll("input")) {

            const value = Number(input.value);

            if (
                input.value.trim() === "" ||
                !Number.isSafeInteger(value) ||
                value < 0 ||
                value > 2147483647
            ) {
                status("Enter valid nonnegative whole numbers.");
                return;
            }

            updated[input.dataset.field] = value;
        }

        updates.push(updated);
    }

    const button = $("saveButton");
    button.disabled = true;

    status("Saving rankings...");

    const { error } = await supabase.rpc(
        "update_rankings",
        { updates }
    );

    button.disabled = false;

    if (error) {
        status("Save failed: " + error.message);
        return;
    }

    $("editor").classList.add("hidden");

    await loadRankings();
};

/* INITIALIZE WEBSITE */

renderRankings();

await loadRankings();
await checkAdmin();

</script>

</body>
</html>
